plate. The structure behaves as a capacitance C in parallel with a conductance G = (σ/ε)C: the two share one field pattern, so their ratio is a material property. Left alone, the charge decays as e<sup>−t/τ</sup> with τ = ε/σ — the same relaxation time that makes conductors field-free inside.</figcaption></figure>
