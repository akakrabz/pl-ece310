 D₂) = ρₛ</text><rect x="430.0" y="153" width="80" height="44" fill="var(--accent2)" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="440.0" y1="153.0" x2="500.0" y2="153.0" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="470.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:11px;">dl  (length L)</text><line x1="500.0" y1="197.0" x2="440.0" y2="197.0" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="470.0" y="213.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">dl</text><line x1="524.0" y1="153.0" x2="524.0" y2="197.0" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><text x="530.0" y="165.0" text-anchor="start" fill="currentColor" style="font-size:11px;">h→0</text><line x1="410.0" y1="100.0" x2="460.0" y2="130.0" stroke="var(--accent2)" stroke-width="2.6" marker-end="url(#ah)" stroke-linecap="round"/><text x="466.0" y="127.0" text-anchor="start" fill="var(--accent2)" style="font-size:15px;font-weight:600;">E₁</text><line x1="410.0" y1="220.0" x2="460.0" y2="237.0" stroke="var(--accent2)" stroke-width="2.6" marker-end="url(#ah)" opacity="0.7" stroke-linecap="round"/><text x="466.0" y="241.0" text-anchor="start" fill="var(--accent2)" style="font-size:15px;font-weight:600;">E₂</text><text x="470.0" y="312.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">E₁ₜL − E₂ₜL = 0  ⇒  n̂×(E₁ − E₂) = 0</text></svg><figcaption><strong>Two integral laws, squeezed onto an interface.</strong> Left: Gauss's law on a pillbox whose height shrinks to zero — the side wall contributes no flux, the two caps give D₁ₙA − D₂ₙA, and the enclosed charge is the surface charge ρₛA. Right: ∮<b>E</b>·d<b>l</b> = 0 around a loop whose short sides shrink — only the two long edges survive, traversed in opposite directions, so the tangential components must match. The unit normal n̂ always points from medium 2 into medium 1.</figcaption></figure>
