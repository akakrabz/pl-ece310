2="350.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="320.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">ρₛ = n̂·D</text><rect x="352.0" y="44" width="48" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="376.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">ρₛ</text><line x1="402.0" y1="60.0" x2="462.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="432.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Q = ∫ρₛ dA</text><rect x="464.0" y="44" width="48" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="488.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">Q</text><line x1="514.0" y1="60.0" x2="574.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="544.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">C = Q/V</text><rect x="576.0" y="44" width="48" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="600.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">C</text><text x="30.0" y="114.0" text-anchor="start" fill="var(--accent2)" style="font-size:13px;font-weight:600;">given Q (charge on the conductors): Gauss first</text><rect x="16.0" y="124" width="48" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="40.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">Q</text><line x1="66.0" y1="140.0" x2="154.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="110.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Gauss's law</text><rect x="156.0" y="124" width="48" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="180.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">D</text><line x1="206.0" y1="140.0" x2="294.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="250.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">E = D/ε</text><rect x="296.0" y="124" width="48" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="320.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">E</text><line x1="346.0" y1="140.0" x2="434.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="390.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">V = −∫E·dl</text><rect x="436.0" y="124" width="48" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="460.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">V</text><line x1="486.0" y1="140.0" x2="574.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="530.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">C = Q/V</text><rect x="576.0" y="124" width="48" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="600.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">C</text><text x="30.0" y="194.0" text-anchor="start" fill="var(--hi)" style="font-size:13px;font-weight:600;">conductance of the same geometry (lossy filling)</text><rect x="16.0" y="204" width="48" height="32" rx="7" fill="var(--hi)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="40.0" y="225.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">V</text><line x1="66.0" y1="220.0" x2="154.0" y2="220.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="110.0" y="210.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">E = −∇V</text><rect x="156.0" y="204" width="48" height="32" rx="7" fill="var(--hi)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="180.0" y="225.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">E</text><line x1="206.0" y1="220.0" x2="294.0" y2="220.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="250.0" y="210.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">J = σE</text><rect x="296.0" y="204" width="48" height="32" rx="7" fill="var(--hi)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="320.0" y="225.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">J</text><line x1="346.0" y1="220.0" x2="434.0" y2="220.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="390.0" y="210.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">I = ∫J·dS</text><rect x="436.0" y="204" width="48" height="32" rx="7" fill="var(--hi)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="460.0" y="225.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">I</text><line x1="486.0" y1="220.0" x2="574.0" y2="220.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="530.0" y="210.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">G = I/V</text><rect x="576.0" y="204" width="48" height="32" rx="7" fill="var(--hi)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="600.0" y="225.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">G</text></svg><figcaption><strong>Three chains, one habit.</strong> Capacitance and conductance are never computed from a formula you remember; they fall out of a chain of steps whose direction depends on what the problem hands you. Given the voltage, start from Laplace's equation and walk to the charge; given the charge, start from Gauss's law and walk to the voltage. For conductance, replace ε by σ and D by J: the geometry factor is the same, which is why G/C = σ/ε whenever one homogeneous medium fills the field region.</figcaption></figure>
