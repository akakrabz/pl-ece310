<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="20.0" y="30.0" width="380.0" height="130.0" rx="0" fill="var(--accent)" fill-opacity="0.06" stroke="none"/><rect x="20.0" y="160.0" width="380.0" height="130.0" rx="0" fill="var(--muted)" fill-opacity="0.12" stroke="none"/><line x1="20.0" y1="160.0" x2="400.0" y2="160.0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="392.0" y="48.0" text-anchor="end" fill="currentColor" style="font-size:13px;">medium 1:  ε₁ = 4ε₀</text><text x="392.0" y="282.0" text-anchor="end" fill="currentColor" style="font-size:13px;">medium 2:  ε₂ = 6ε₀</text><line x1="215.0" y1="160.0" x2="215.0" y2="50.0" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)" stroke-linecap="round"/><text x="221.0" y="60.0" text-anchor="start" fill="currentColor" style="font-size:14px;font-weight:600;">n̂</text><line x1="215.0" y1="160.0" x2="215.0" y2="270.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6" stroke-linecap="round"/><line x1="167.0" y1="64.0" x2="215.0" y2="160.0" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><text x="159.0" y="58.0" text-anchor="end" fill="var(--accent)" style="font-size:13px;font-weight:600;">E₁ = 3x̂ − 6ẑ</text><line x1="215.0" y1="160.0" x2="263.0" y2="224.0" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><text x="271.0" y="230.0" text-anchor="start" fill="var(--accent)" style="font-size:13px;font-weight:600;">E₂ = 3x̂ − 4ẑ</text><line x1="167.0" y1="64.0" x2="215.0" y2="64.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7" stroke-linecap="round"/><line x1="215.0" y1="224.0" x2="263.0" y2="224.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7" stroke-linecap="round"/><line x1="167.0" y1="54.0" x2="215.0" y2="54.0" stroke="var(--accent2)" stroke-width="2" marker-end="url(#ahs)" stroke-linecap="round"/><text x="191.0" y="48.0" text-anchor="middle" fill="var(--accent2)" style="font-size:11px;">Eₜ = 3</text><line x1="215.0" y1="234.0" x2="263.0" y2="234.0" stroke="var(--accent2)" stroke-width="2" marker-end="url(#ahs)" stroke-linecap="round"/><text x="239.0" y="250.0" text-anchor="middle" fill="var(--accent2)" style="font-size:11px;">Eₜ = 3</text><text x="221.0" y="112.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">Eₙ = −6</text><text x="209.0" y="196.0" text-anchor="end" fill="var(--muted)" style="font-size:11px;">Eₙ = −4</text><text x="209.0" y="104.0" text-anchor="end" fill="currentColor" style="font-size:13px;">θ₁</text><text x="253.0" y="194.0" text-anchor="start" fill="currentColor" style="font-size:13px;">θ₂</text><text x="418.0" y="56.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-weight:600;">tangential E continuous:</text><text x="418.0" y="76.0" text-anchor="start" fill="currentColor" style="font-size:12px;">E₁ₜ = E₂ₜ = 3</text><text x="418.0" y="112.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-weight:600;">normal D continuous</text><text x="418.0" y="130.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">(no free surface charge):</text><text x="418.0" y="150.0" text-anchor="start" fill="currentColor" style="font-size:12px;">ε₁E₁ₙ = ε₂E₂ₙ</text><text x="418.0" y="168.0" text-anchor="start" fill="currentColor" style="font-size:12px;">E₂ₙ = (4/6)(−6) = −4</text><text x="418.0" y="204.0" text-anchor="start" fill="currentColor" style="font-size:12px;">Entering the higher-ε side</text><text x="418.0" y="222.0" text-anchor="start" fill="currentColor" style="font-size:12px;">the normal part shrinks, so</text><text x="418.0" y="240.0" text-anchor="start" fill="currentColor" style="font-size:12px;">the field tilts toward the surface:</text><text x="418.0" y="266.0" text-anchor="start" fill="currentColor" style="font-size:13px;font-weight:600;">tan θ₁ / tan θ₂ = ε₁ / ε₂</text></svg><figcaption><strong>How E bends at a dielectric interface.</strong> Split the field into a tangential part (parallel to the surface) and a normal part. The tangential part is the same on both sides; the normal part scales by ε₁/ε₂ so that <b>D</b>ₙ = εEₙ is the same on both sides. Here the field enters the higher-permittivity medium, its normal component shrinks from 6 to 4, and the arrow tilts toward the surface. Angles are measured from the normal.</figcaption></figure>
