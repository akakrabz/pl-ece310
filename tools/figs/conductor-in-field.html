r kills the field inside itself.</strong> (a) Two charged sheets set up a uniform field E₀. (b) A conducting slab is inserted: free electrons drift against E₀ toward the bottom face, leaving the top face positive. The induced pair ±ρₛ produces −E₀ inside the slab, so the total interior field is zero and current stops. Outside the slab nothing changes. The induced charge sits only on the surfaces; the interior stays neutral and at one potential.</figcaption></figure>
